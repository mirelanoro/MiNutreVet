<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MiNutre Vet</title>
<style>

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--v:#2D4A3E;--vl:#3d6455;--vc:#e8f0ec;--d:#8B7340;--dl:#b8975a;--cr:#F5F0EB;--cr2:#EDE7DE;--br:#FAFAF8;--tx:#1C2B26;--tl:#5A6B63;--ok:#27ae60;--al:#c0392b;--am:#f39c12}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--cr);color:var(--tx);height:100vh;overflow:hidden}
.screen{display:none;height:100vh;flex-direction:column;background:var(--br);max-width:480px;margin:0 auto}
.screen.active{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 48px}
.tb{background:var(--v);padding:0 14px;height:56px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.tb-logo{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid rgba(139,115,64,.5);flex-shrink:0}
.tb-brand{font-size:.86rem;color:var(--cr);font-weight:700}
.tb-sub{font-size:.58rem;color:rgba(245,240,235,.55)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.badge-vet{background:rgba(139,115,64,.3);border:1px solid var(--d);border-radius:20px;padding:3px 10px;font-size:.58rem;color:var(--dl)}
.btn-back{background:none;border:none;color:var(--cr);font-size:1.5rem;cursor:pointer;padding:4px 8px;line-height:1;flex-shrink:0}
.tb-title{font-size:.86rem;color:var(--cr);font-weight:600;flex:1;text-align:center}
.btn-tbtext{background:none;border:none;color:var(--dl);font-size:.75rem;font-weight:700;cursor:pointer;padding:4px 8px;flex-shrink:0}
.tab-bar{display:flex;border-bottom:1px solid var(--cr2);background:var(--br);flex-shrink:0}
.tab-btn{flex:1;padding:9px 2px;font-size:.62rem;font-weight:500;color:var(--tl);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab-btn.active{color:var(--v);border-bottom-color:var(--v);font-weight:700}
#s-login{background:linear-gradient(160deg,#1a2e25,#2D4A3E,#3d6455);align-items:center;justify-content:flex-start;padding:28px 20px 24px;gap:0;overflow-y:auto}
.lg-logo{width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid rgba(139,115,64,.5);margin-bottom:10px}
.lg-brand{font-size:1.5rem;font-weight:700;color:var(--cr);letter-spacing:.1em}
.lg-tag{font-size:.58rem;color:rgba(245,240,235,.4);letter-spacing:.16em;text-transform:uppercase;margin-top:3px}
.lg-line{width:34px;height:1px;background:var(--d);margin:12px auto;opacity:.5}
.lg-card{background:var(--cr);border-radius:12px;padding:22px;width:100%;max-width:340px}
.lg-h{font-size:1.1rem;font-weight:700;color:var(--v);margin-bottom:16px}
.lg-crmv{font-size:.56rem;color:rgba(245,240,235,.28);text-align:center;margin-top:14px;letter-spacing:.06em}
.btn-p{width:100%;border:none;padding:13px;border-radius:8px;font-size:.87rem;font-weight:600;cursor:pointer;font-family:-apple-system,sans-serif;margin-bottom:8px;display:block}
.btn-green{background:var(--v);color:var(--cr)}
.btn-outline{background:transparent;color:var(--v);border:2px solid var(--v) !important}
.btn-gold{background:var(--d);color:var(--cr)}
.btn-gray{background:var(--cr2);color:var(--v)}
.btn-icon{background:none;border:none;cursor:pointer;padding:3px 6px;font-size:.8rem}
.btn-add-block{display:flex;align-items:center;gap:10px;background:var(--vc);border:1.5px dashed var(--v);border-radius:12px;padding:13px;cursor:pointer;width:100%;margin-top:8px;font-family:-apple-system,sans-serif}
.flbl{display:block;font-size:.63rem;letter-spacing:.11em;text-transform:uppercase;color:var(--tl);margin-bottom:4px;font-weight:500}
.finp{width:100%;padding:10px 12px;border:1.5px solid var(--cr2);border-radius:8px;font-size:.85rem;color:var(--tx);background:var(--br);outline:none;-webkit-appearance:none;font-family:-apple-system,sans-serif;margin-bottom:10px}
.finp:focus{border-color:var(--v)}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fta{min-height:72px;resize:vertical}
.box-info{background:var(--vc);border:1px solid rgba(45,74,62,.2);border-radius:8px;padding:9px 12px;margin-bottom:9px;font-size:.75rem;color:var(--v);line-height:1.6}
.box-alert{background:#fff3f3;border:1px solid #fcc;border-radius:8px;padding:9px 12px;margin-bottom:8px;font-size:.73rem;color:var(--al);line-height:1.5}
.box-warn{background:#fff8e1;border:1px solid #ffe082;border-radius:8px;padding:9px 12px;margin-bottom:9px;font-size:.75rem;color:#7b5800;line-height:1.5}
.vet-badge{background:#fdf3e3;border:1px solid var(--d);border-radius:6px;padding:3px 9px;font-size:.59rem;color:var(--d);display:inline-block;margin-bottom:9px}
.divider{height:1px;background:var(--cr2);margin:14px 0}
.fblock{background:var(--br);border:1px solid var(--cr2);border-radius:12px;padding:12px;margin-bottom:9px}
.fblock-title{font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--d);margin-bottom:7px;font-weight:600}
.frow{display:flex;justify-content:space-between;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--cr2);gap:6px}
.frow:last-child{border-bottom:none}
.fkey{font-size:.72rem;color:var(--tl);flex-shrink:0}
.fval{font-size:.76rem;color:var(--tx);font-weight:600;text-align:right}
.ing-table{background:var(--br);border:1px solid var(--cr2);border-radius:12px;overflow:hidden;margin-bottom:11px}
.ing-thead{background:var(--v);padding:8px 12px;display:flex;justify-content:space-between}
.ing-th{font-size:.58rem;letter-spacing:.09em;text-transform:uppercase;color:rgba(245,240,235,.75)}
.ing-row{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid var(--cr2)}
.ing-row:last-child{border-bottom:none}
.ing-row.sr{background:#fffbf5}
.ing-nm{font-size:.77rem;color:var(--tx);font-weight:500}
.ing-ob{font-size:.59rem;color:var(--tl);margin-top:1px}
.ing-qty{font-size:.92rem;font-weight:700;color:var(--v);white-space:nowrap}
.pac-header{background:var(--v);padding:16px 16px 28px;position:relative}
.pac-header::after{content:"";position:absolute;bottom:-12px;left:0;right:0;height:24px;background:var(--br);border-radius:16px 16px 0 0}
.pac-stats{display:flex;gap:5px;margin-top:8px}
.pstat{background:rgba(255,255,255,.1);border-radius:8px;padding:6px 7px;flex:1;text-align:center}
.pstat.alert{background:rgba(139,58,42,.35)}
.pstat-v{font-size:1rem;font-weight:700;color:var(--cr)}
.pstat-l{font-size:.52rem;color:rgba(245,240,235,.5);text-transform:uppercase;letter-spacing:.05em}
.mod-card{background:var(--br);border:1.5px solid var(--cr2);border-radius:12px;padding:13px 14px;display:flex;align-items:center;gap:11px;margin-bottom:8px;cursor:pointer}
.mod-card:active{opacity:.8}
.mod-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.15rem;flex-shrink:0}
.ic-v{background:var(--vc)}.ic-d{background:#fdf3e3}.ic-t{background:#fde8e8}.ic-a{background:#e8f0f8}.ic-p{background:#f3e8f8}.ic-g{background:#e8f8f0}
.mbadge{border-radius:10px;padding:3px 8px;font-size:.58rem;font-weight:600}
.mb-ok{background:var(--ok);color:#fff}.mb-lock{background:var(--cr2);color:var(--tl)}
.eyebrow{font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--d);margin-bottom:3px;display:block}
.sec-h{font-size:1.35rem;font-weight:700;color:var(--v);margin-bottom:11px}
.tags-row{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px}
.tag{padding:1px 6px;border-radius:10px;font-size:.55rem}
.tag-a{background:#fde8e8;color:var(--al)}.tag-i{background:var(--vc);color:var(--v)}
.cad-sec{background:var(--vc);border-radius:6px;padding:6px 11px;margin:10px 0 8px;font-size:.59rem;color:var(--v);font-weight:700;letter-spacing:.11em;text-transform:uppercase}
.tutora-card{background:var(--vc);border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.animal-card{background:var(--br);border:1.5px solid var(--cr2);border-radius:12px;padding:13px;display:flex;align-items:center;gap:10px;margin-bottom:9px;cursor:pointer}
.animal-card:active{opacity:.8}
.hist-row{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--br);border:1px solid var(--cr2);border-radius:8px;margin-bottom:4px}
.hist-wk{font-size:.66rem;color:var(--tl)}
.hist-peso{font-size:.98rem;font-weight:700;color:var(--v)}
.delta{font-size:.63rem;padding:2px 6px;border-radius:10px}
.d-dn{background:#e8f5e9;color:var(--ok)}.d-up{background:#fde8e8;color:var(--al)}.d-acc{background:#fff3e0;color:#e65100}
.chart-wrap{background:var(--br);border:1px solid var(--cr2);border-radius:12px;padding:11px;margin-bottom:11px;overflow-x:auto}
.chart-tit{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--d);margin-bottom:7px}
.ecc-row{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:5px}
.ecc-btn{flex:1;min-width:26px;height:32px;border-radius:6px;border:1.5px solid var(--cr2);background:var(--br);font-size:.72rem;cursor:pointer;font-weight:600;color:var(--tl)}
.ecc-btn.active{background:var(--v);border-color:var(--v);color:var(--cr)}
.circ-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--cr2)}
.circ-row:last-child{border-bottom:none}
.circ-inp{width:62px;padding:4px 6px;border:1px solid var(--cr2);border-radius:5px;text-align:right;font-size:.78rem;-webkit-appearance:none;font-family:-apple-system,sans-serif}
.tr-hdr{background:var(--vc);border-radius:12px;padding:12px 13px;margin-bottom:11px}
.pb-bg{background:var(--cr2);border-radius:10px;height:5px;overflow:hidden;margin:7px 0 3px}
.pb-fill{height:100%;border-radius:10px;transition:width .4s}
.day-scroll{display:flex;gap:4px;overflow-x:auto;padding-bottom:5px;margin-bottom:11px;scrollbar-width:none}
.day-scroll::-webkit-scrollbar{display:none}
.day-btn{flex-shrink:0;width:38px;height:46px;border-radius:8px;border:1.5px solid var(--cr2);background:var(--br);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:1px}
.day-btn.active{background:var(--v);border-color:var(--v)}
.day-btn.done{background:var(--vc);border-color:var(--v)}
.day-num{font-size:.68rem;font-weight:600;color:var(--tl)}
.day-btn.active .day-num{color:var(--cr)}
.day-btn.done .day-num{color:var(--v)}
.b-row{display:flex;gap:3px;margin-bottom:9px}
.b-btn{flex:1;padding:8px 2px;border-radius:7px;border:1.5px solid var(--cr2);background:var(--br);text-align:center;cursor:pointer}
.b-btn.active{background:var(--v);border-color:var(--v)}
.b-num{font-size:.8rem;font-weight:600;color:var(--tl)}
.b-btn.active .b-num{color:var(--cr)}
.ref-tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:5px;margin-bottom:11px;scrollbar-width:none}
.ref-tabs::-webkit-scrollbar{display:none}
.ref-tab{flex-shrink:0;padding:6px 12px;border-radius:20px;border:1.5px solid var(--cr2);background:var(--br);font-size:.68rem;font-weight:500;color:var(--tl);cursor:pointer;white-space:nowrap}
.ref-tab.active{background:var(--v);border-color:var(--v);color:var(--cr)}
.pill{background:var(--v);color:var(--cr);border-radius:20px;padding:3px 11px;font-size:.66rem;display:inline-block;margin-bottom:9px}
.total-bar{background:var(--vc);border-radius:8px;padding:8px 12px;display:flex;justify-content:space-between;margin-top:2px;margin-bottom:6px}
.meta-pill{display:inline-flex;align-items:center;gap:5px;background:var(--vc);border-radius:20px;padding:5px 12px;margin-bottom:11px}
.big-inp-row{display:flex;gap:7px;align-items:flex-end;margin-bottom:11px}
.big-inp{width:100%;padding:11px;border:2px solid var(--cr2);border-radius:8px;font-size:1.35rem;color:var(--v);text-align:center;background:var(--br);-webkit-appearance:none;outline:none}
.big-inp:focus{border-color:var(--v)}
.btn-addw{background:var(--v);color:var(--cr);border:none;padding:11px 13px;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap}
.supl-block{background:#fffbf5;border:1px solid var(--cr2);border-radius:8px;padding:9px 11px;margin-bottom:6px}
.edit-inp{width:62px;padding:4px 6px;border:1.5px solid var(--cr2);border-radius:5px;text-align:center;font-size:.82rem;color:var(--v);font-weight:700;-webkit-appearance:none;font-family:-apple-system,sans-serif}
.edit-row{display:flex;align-items:center;gap:7px;padding:8px 11px;border-bottom:1px solid var(--cr2)}
.edit-row:last-child{border-bottom:none}
.loading-overlay{position:fixed;inset:0;background:rgba(45,74,62,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:12px}
.spinner{display:inline-block;width:32px;height:32px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

</style>
</head>

function g(id){ return document.getElementById(id); }
function fmt(n,d){ return parseFloat(n).toFixed(d===undefined?1:d); }
function today(){
  var d=new Date();
  return ("0"+d.getDate()).slice(-2)+"/"+("0"+(d.getMonth()+1)).slice(-2)+"/"+d.getFullYear();
}
function isoToday(){return new Date().toISOString().slice(0,10);}
function fmtDate(iso){return iso?iso.split("-").reverse().join("/"):""}
function parseDate(s){
  if(!s)return null;
  var p=s.split("/");
  return p.length===3?new Date(p[2],p[1]-1,p[0]):null;
}
function diasAte(s){
  var d=parseDate(s); if(!d)return null;
  var h=new Date(); h.setHours(0,0,0,0); d.setHours(0,0,0,0);
  return Math.round((d-h)/86400000);
}
function clone(o){return JSON.parse(JSON.stringify(o));}
function mk(tag,css,html){
  var e=document.createElement(tag);
  if(css)e.style.cssText=css;
  if(html!==undefined)e.innerHTML=html;
  return e;
}
function mkDiv(css,html){return mk("div",css,html);}
function ap(parent){
  var children=Array.prototype.slice.call(arguments,1);
  children.forEach(function(c){if(c)parent.appendChild(c);});
  return parent;
}
function lbl(txt){var l=mk("div");l.className="flbl";l.textContent=txt;return l;}
function inp(id,type,val,ph,mb0){

function calcPlanoInfo(id){
  var pl=planosDB[id];
  if(!pl||!pl.fim) return {ativo:true,dias:null};
  var parts=pl.fim.split("/");
  var end=new Date(parts[2],parts[1]-1,parts[0]);
  var now=new Date();now.setHours(0,0,0,0);
  var dias=Math.round((end-now)/86400000);
  return {ativo:dias>=0,dias:Math.max(0,dias),end:pl.fim};
}
function addDataFim(dataCons,meses){
  var parts=dataCons.split("/");
  var d=new Date(parts[2],parts[1]-1+meses,parts[0]);
  return ("0"+d.getDate()).slice(-2)+"/"+("0"+(d.getMonth()+1)).slice(-2)+"/"+d.getFullYear();
}

}

function salvarFicha(){
  var p=DB[pac];
  function gv(id){var e=g(id);return e?e.value:null;}
  function gn(id){var v=parseFloat(gv(id));return isNaN(v)?null:v;}
  function gi(id){var v=parseInt(gv(id));return isNaN(v)?null:v;}
  if(gv("ef-responsavel"))p.responsavel=gv("ef-responsavel");
  if(gv("ef-nome"))p.nome=gv("ef-nome");
  if(gv("ef-emoji"))p.emoji=gv("ef-emoji");
  if(gv("ef-raca"))p.raca=gv("ef-raca");
  if(gv("ef-porte"))p.porte=gv("ef-porte");
  if(gv("ef-idade"))p.idade=gv("ef-idade");
  if(gv("ef-data"))p.dataCons=gv("ef-data");
  if(gn("ef-peso"))p.peso=gn("ef-peso");
  if(gn("ef-meta"))p.meta=gn("ef-meta");
  if(gn("ef-ecc")){p.ecc=gn("ef-ecc");eccSt[pac]=p.ecc;}
  if(gn("ef-imm")){p.imm=gn("ef-imm");immSt[pac]=p.imm;}
  if(gn("ef-kcal"))p.kcal=gn("ef-kcal");
  if(gi("ef-refs"))p.refs=gi("ef-refs");
  var ar=gv("ef-alertas");if(ar){var na=ar.split("\n").map(function(x){return x.trim();}).filter(Boolean);if(na.length)p.alertas=na;}
  p.especial=gv("ef-especial")||p.especial;
  var nh=[];
  for(var h=0;h<p.refs+2;h++){var hv=gv("ef-hor"+h);if(hv&&hv.trim())nh.push(hv.trim());}
  if(nh.length)p.horarios=nh;
  ["cervical","toracica","abdominal","coxa_d","coxa_e"].forEach(function(k){
    var v=gn("ef-circ-"+k);if(v!==null){p.circ[k]=v;if(circSt[pac])circSt[pac][k]=v;}
  });
  if(!p.editLog)p.editLog=[];
  p.editLog.push({data:today(),por:role==="vet"?"Veterinária":"Responsável"});
  renderFicha();show("s-ficha");
  setTimeout(function(){alert("✅ Ficha atualizada!");},80);
}

function saveFormulacao(){
  var p=DB[pac];
  p.alimentos.forEach(function(a,i){var e=g("ai_"+i);if(e){var v=parseFloat(e.value);if(!isNaN(v)&&v>=0){a.r=v;a.g=v*p.refs;}}});
  p.suplementos.forEach(function(s,i){
    var ei=g("si_"+i);var ef=g("sf_"+i);
    if(ei){var v=parseFloat(ei.value);if(!isNaN(v)&&v>=0)s.rPorRef=v;}
    if(ef){s.refs=parseInt(ef.value)||s.refs;}
    s.gDia=s.rPorRef*s.refs;
  });
  // Update custosDB usoDia
  if(custosDB[pac]){
    custosDB[pac].alimentos.forEach(function(c){var a=p.alimentos.find(function(x){return x.n===c.nome;});if(a)c.usoDia=a.r*p.refs;});
    custosDB[pac].suplementos.forEach(function(c){var s=p.suplementos.find(function(x){return x.n===c.nome;});if(s)c.usoDia=s.gDia;});
  }
  renderDieta();show("s-dieta");
  setTimeout(function(){alert("✅ Formulação salva!");},80);
}

  var camInp=mk("input");camInp.type="file";camInp.accept="image/*,video/*";camInp.capture="environment";camInp.style.display="none";camInp.id="evol-cam";
  var galInp=mk("input");galInp.type="file";galInp.accept="image/*,video/*,.pdf";galInp.style.display="none";galInp.id="evol-gal";
  var btnRow=mkDiv("display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px");
  var camBtn=mk("button");camBtn.style.cssText="padding:10px;border:1.5px dashed var(--d);border-radius:8px;background:transparent;color:var(--d);font-size:.78rem;cursor:pointer;font-family:-apple-system,sans-serif";camBtn.textContent="📷 Câmera";
  var galBtn=mk("button");galBtn.style.cssText="padding:10px;border:1.5px dashed var(--d);border-radius:8px;background:transparent;color:var(--d);font-size:.78rem;cursor:pointer;font-family:-apple-system,sans-serif";galBtn.textContent="🖼️ Galeria / Arquivo";
  camBtn.addEventListener("click",function(){camInp.click();});
  galBtn.addEventListener("click",function(){galInp.click();});
  ap(btnRow,camBtn,galBtn);
  ap(fileWrap,btnRow,camInp,galInp,prev);
  var activeFileInp=null;
  function handleFileSelect(inp){
    prev.innerHTML="";if(!inp.files||!inp.files[0])return;
    activeFileInp=inp;
    var reader=new FileReader();
    reader.onload=function(e){
      var f=inp.files[0];
      if(f.type.indexOf("image")>=0){var img=mk("img");img.src=e.target.result;img.style.cssText="width:100%;border-radius:8px;max-height:180px;object-fit:cover";prev.appendChild(img);}
      else{var ok=mkDiv();ok.className="box-info";ok.textContent="✅ "+f.name;prev.appendChild(ok);}
    };
    reader.readAsDataURL(inp.files[0]);
  }
  camInp.addEventListener("change",function(){handleFileSelect(camInp);});
  galInp.addEventListener("change",function(){handleFileSelect(galInp);});
  var fileInp={files:null,get files(){return activeFileInp?activeFileInp.files:null;}};
  b.appendChild(fileWrap);
  ap(b,lbl("Data do registro"));
  var dateInpEvol=mk("input");dateInpEvol.className="finp";dateInpEvol.type="date";dateInpEvol.id="evol-data";dateInpEvol.value=isoToday();b.appendChild(dateInpEvol);
  ap(b,lbl("Peso atual (kg) — opcional"),inp("evol-peso","number",null,"Ex: 7.2"));
  ap(b,lbl("Observações"));

  var sv=mk("button");sv.className="btn-p btn-green";sv.style.marginTop="8px";sv.textContent="✅ Salvar registro";
  sv.addEventListener("click",function(){
    var obs2=g("evol-obs")?g("evol-obs").value.trim():"";
    var pesoV=parseFloat(g("evol-peso")?g("evol-peso").value:"")||null;
    if(!obs2&&(!fileInp.files||!fileInp.files[0])){alert("Adicione uma observação ou arquivo.");return;}
    function fin(dataURL){
      var evolDataVal=g("evol-data")&&g("evol-data").value?fmtDate(g("evol-data").value):today();
      evolDB[pac].push({id:Date.now(),data:evolDataVal,tipo:selType,dataURL:dataURL||null,obs:obs2,peso:pesoV});
      if(role==="responsavel"){novosRegistros[pac]=(novosRegistros[pac]||0)+1;sendAlerta(pac,"vet","evolucao","Novo registro de evolução adicionado para "+DB[pac].nome+".");}
      if(pesoV)pesos[pac].push({semana:"Sem. "+pesos[pac].length,data:today(),peso:pesoV,nota:"Evolução"});
      renderEvolucao();
    }
    var activeFiles=activeFileInp?activeFileInp.files:null;
    if(activeFiles&&activeFiles[0]){var reader=new FileReader();reader.onload=function(e){fin(e.target.result);};reader.readAsDataURL(fileInp.files[0]);}
    else fin(null);
  });
  b.appendChild(sv);
  var cv=mk("button");cv.className="btn-p btn-gray";cv.textContent="Cancelar";cv.addEventListener("click",function(){renderEvolucao();});b.appendChild(cv);
}

function salvarCadastro(){
  var nome=(g("c-nome")?g("c-nome").value:"").trim();
  var pesoV=parseFloat(g("c-peso")?g("c-peso").value:"");
  var metaV=parseFloat(g("c-meta")?g("c-meta").value:"");
  if(!nome||isNaN(pesoV)||isNaN(metaV)){alert("Preencha nome, peso atual e peso-alvo.");return;}
  var alertasRaw=g("c-alertas")?g("c-alertas").value:"";
  var alertas=alertasRaw.split(" / ").map(function(a){return a.trim();}).filter(Boolean);
  if(!alertas.length)alertas=["Sem alertas cadastrados"];
  var hors=[];
  for(var h=0;h<3;h++){var hv=(g("c-hor"+h)?g("c-hor"+h).value:"").trim();if(hv)hors.push(hv);}
  if(!hors.length)hors=["07:00–08:00 · Refeição 1","13:00–14:00 · Refeição 2"];
  var dv=g("c-data")?g("c-data").value:"";
  var df=dv?fmtDate(dv):today();
  // Collect ingredients
  var ings=[];
  if(window._cadIngs){
    window._cadIngs.forEach(function(ing){
      if(ing.n.trim()&&ing.r>0){
        ings.push({n:ing.n.trim(),r:ing.r,g:ing.r*(parseInt(g("c-refs")?g("c-refs").value:2)||2),ob:"",u:ing.u});
      }
    });
  }
  // Collect supls
  var supls=[];
  if(window._cadSupls){
    window._cadSupls.forEach(function(s,i){
      var n=(g("csd_"+i)?g("csd_"+i).value:"");
      var nm=(window._cadSupls[i].n||"").trim();
      var d=parseFloat(g("csd_"+i)?g("csd_"+i).value:0)||0;
      var f=parseInt(g("csf_"+i)?g("csf_"+i).value:2)||2;
      var u=g("csu_"+i)?g("csu_"+i).value:"mg";
      var ob=(g("cso_"+i)?g("cso_"+i).value:"").trim();
      if(nm)supls.push({n:nm,rPorRef:d,refs:f,gDia:d*f,ob:ob,u:u});
    });
  }
  var id="pac_"+Date.now();
  DB[id]={
    id:id,nome:nome,
    emoji:(g("c-emoji")?g("c-emoji").value:"")||"🐾",
    responsavel:(g("c-responsavel")?g("c-responsavel").value:"").trim()||"Responsável",
    raca:(g("c-raca")?g("c-raca").value:"").trim()||"SRD",
    porte:(g("c-porte")?g("c-porte").value:"")||"Médio",
    idade:(g("c-idade")?g("c-idade").value:"").trim()||"—",
    peso:pesoV,meta:metaV,
    ecc:parseFloat(g("c-ecc")?g("c-ecc").value:5)||5,
    imm:parseInt(g("c-imm")?g("c-imm").value:2)||2,
    kcal:parseInt(g("c-kcal")?g("c-kcal").value:300)||300,
    fator:70,refs:parseInt(g("c-refs")?g("c-refs").value:2)||2,
    dataCons:df,temCaldo:false,
    alertas:alertas,
    especial:(g("c-especial")?g("c-especial").value:"").trim(),
    horarios:hors,
    circ:{cervical:0,toracica:0,abdominal:0,coxa_d:0,coxa_e:0},
    alimentos:ings,
    suplementos:supls,
    dietas:[{id:1,nome:"Dieta inicial",data:df,ativa:true,alimentos:ings,suplementos:supls}]
  };
  initPac(id);
  renderPacList();
  show("s-pacientes");
  setTimeout(function(){alert("✅ Paciente "+nome+" cadastrado!");},120);
}

  var ndTitle = mkDiv("font-size:.82rem;font-weight:700;color:var(--v);margin-bottom:6px");ndTitle.textContent="📋 Criar nova versão da dieta";b.appendChild(ndTitle);

    p.alimentos.forEach(function(a,i){var e=g("ai_"+i);if(e){var v=parseFloat(e.value);if(!isNaN(v)&&v>=0){a.r=v;a.g=v*p.refs;}}});

    // Create new version
    p.dietas.push({id:Date.now(),nome:"Dieta v"+(p.dietas.length+1),data:today(),ativa:true,alimentos:JSON.parse(JSON.stringify(p.alimentos)),suplementos:JSON.parse(JSON.stringify(p.suplementos))});

  });

      var htit=mkDiv("font-size:.82rem;font-weight:700;color:var(--v);margin-bottom:8px");htit.textContent="📂 Histórico de dietas anteriores";b.appendChild(htit);
      hist.forEach(function(d){
        var bl=mkDiv();bl.className="fblock";bl.style.marginBottom="8px";
        var bt=mkDiv();bt.className="fblock-title";bt.textContent=d.nome+" · "+d.data+(d.dataFim?" → "+d.dataFim:"");bl.appendChild(bt);
        d.alimentos.forEach(function(a){
          var row=mkDiv();row.className="frow";
          var k=mk("span");k.className="fkey";k.textContent=a.n;
          var v=mk("span");v.className="fval";v.textContent=a.r+" "+a.u+"/ref";
          ap(row,k,v);bl.appendChild(row);
        });
        // Restore button
        var rb=mk("button");rb.style.cssText="background:var(--am);color:#fff;border:none;padding:4px 10px;border-radius:5px;font-size:.62rem;cursor:pointer;margin-top:7px;font-family:-apple-system,sans-serif";rb.textContent="↩ Restaurar esta dieta";
        (function(diet){rb.addEventListener("click",function(){if(confirm("Restaurar esta versão da dieta? A atual será arquivada.")){p.dietas.forEach(function(dd){dd.ativa=false;dd.dataFim=today();});diet.ativa=true;diet.dataFim=null;p.alimentos=JSON.parse(JSON.stringify(diet.alimentos));p.suplementos=JSON.parse(JSON.stringify(diet.suplementos));renderDieta();show("s-dieta");setTimeout(function(){alert("✅ Dieta restaurada!");},80);}});})(d);

  var pl=planosDB[pac];

function fmtDate2(ddmmyyyy){
  // Convert DD/MM/YYYY to YYYY-MM-DD for date inputs
  if(!ddmmyyyy)return "";
  var p=ddmmyyyy.split("/");
  if(p.length===3)return p[2]+"-"+p[1]+"-"+p[0];
  return "";
}

var patientPhotos = {}; // {pacId: dataURL}

function renderPhotoUpload(container, pacId){
  var wrap=mkDiv("text-align:center;margin-bottom:12px");
  var photoSize="70px";
  var circle=mkDiv("width:"+photoSize+";height:"+photoSize+";border-radius:50%;overflow:hidden;border:2px solid var(--d);margin:0 auto 6px;cursor:pointer;background:var(--vc);display:flex;align-items:center;justify-content:center;font-size:1.8rem");
  if(patientPhotos[pacId]){var img=mk("img");img.src=patientPhotos[pacId];img.style.cssText="width:100%;height:100%;object-fit:cover";circle.appendChild(img);}
  else{circle.textContent=DB[pacId]?DB[pacId].emoji:"🐾";}
  var fileInp=mk("input");fileInp.type="file";fileInp.accept="image/*";fileInp.style.display="none";
  var capLbl=mkDiv("font-size:.62rem;color:var(--d);cursor:pointer");capLbl.textContent="📷 Foto do paciente";
  circle.addEventListener("click",function(){fileInp.click();});
  capLbl.addEventListener("click",function(){fileInp.click();});
  fileInp.addEventListener("change",function(){
    if(!this.files||!this.files[0])return;
    var reader=new FileReader();
    reader.onload=function(e){
      patientPhotos[pacId]=e.target.result;
      renderPhotoUpload(container,pacId);
      // Refresh pac list if visible so photo appears there too
      var pacListEl=g("pac-list");
      if(pacListEl&&pacListEl.children.length>0) renderPacList();
    };
    reader.readAsDataURL(this.files[0]);
  });
  wrap.innerHTML="";
  ap(wrap,circle,capLbl,fileInp);
  container.innerHTML="";
  container.appendChild(wrap);
}

    });})(vi,varItem);
    ap(regRow,rDateW,rValW,rAddBtn);card.appendChild(regRow);

    // Chart if 2+ records
    if(varItem.registros.length>=2){
      var cw=mkDiv();cw.className="chart-wrap";
      var W=Math.min(window.innerWidth-64,410),H=130;
      var pd2={t:12,r:20,b:22,l:42};var cw2=W-pd2.l-pd2.r,ch2=H-pd2.t-pd2.b;
      var vals=varItem.registros.map(function(r){return r.valor;});
      var mn=Math.min.apply(null,vals)-Math.abs(Math.min.apply(null,vals)*0.05)-0.1;
      var mx=Math.max.apply(null,vals)+Math.abs(Math.max.apply(null,vals)*0.05)+0.1;
      function yx2(v){return pd2.t+ch2-(v-mn)/(mx-mn)*ch2;}
      function xx2(i2){return pd2.l+i2*(cw2/Math.max(varItem.registros.length-1,1));}
      var svgS="<svg width='"+W+"' height='"+H+"' viewBox='0 0 "+W+" "+H+"' style='display:block'>";
      for(var gi=0;gi<=3;gi++){var gy=pd2.t+ch2*(gi/3);var gvv=(mx-(mx-mn)*(gi/3)).toFixed(1);svgS+="<line x1='"+pd2.l+"' y1='"+gy+"' x2='"+(pd2.l+cw2)+"' y2='"+gy+"' stroke='#EDE7DE' stroke-width='1'/><text x='"+(pd2.l-3)+"' y='"+(gy+4)+"' text-anchor='end' font-size='8' fill='#5A6B63'>"+gvv+"</text>";}
      var pts2=varItem.registros.map(function(r,i2){return xx2(i2)+","+yx2(r.valor);}).join(" ");
      svgS+="<polyline points='"+pts2+"' fill='none' stroke='#2D4A3E' stroke-width='2' stroke-linejoin='round'/>";
      varItem.registros.forEach(function(r,i2){svgS+="<circle cx='"+xx2(i2)+"' cy='"+yx2(r.valor)+"' r='3.5' fill='#2D4A3E'/><text x='"+xx2(i2)+"' y='"+(yx2(r.valor)-6)+"' text-anchor='middle' font-size='8' fill='#2D4A3E'>"+r.valor+"</text><text x='"+xx2(i2)+"' y='"+(H-4)+"' text-anchor='middle' font-size='7' fill='#5A6B63'>"+r.data.slice(0,5)+"</text>";});
      svgS+="</svg>";
      cw.innerHTML="<div class='chart-tit'>"+varItem.nome+" ("+varItem.unidade+")</div>"+svgS;
      card.appendChild(cw);
    }

    // Records table
    if(varItem.registros.length){
      var tbl=mkDiv();tbl.className="ing-table";

function _getSession(){
  try{
    var s=JSON.parse(localStorage.getItem("_sb")||"{}");
    if(s&&s.access_token&&s.expires_at>Math.floor(Date.now()/1000))return s;
  }catch(e){}
  return null;
}

function _setSession(d){
  d.expires_at=Math.floor(Date.now()/1000)+(d.expires_in||3600);
  try{localStorage.setItem("_sb",JSON.stringify(d));}catch(e){}
}

function _clearSession(){
  try{localStorage.removeItem("_sb");}catch(e){}
}

function _loadPatients(uid,cb){
  fetch(_SB+"/rest/v1/pacientes?select=*&vet_id=eq."+uid+"&apikey="+_K)
  .then(function(r){return r.json();})
  .then(function(data){
    if(!Array.isArray(data)){if(cb)cb();return;}
    data.forEach(function(p){
      p.alertas=p.alertas||[];p.horarios=p.horarios||[];
      p.alimentos=p.alimentos||[];p.suplementos=p.suplementos||[];
      p.circ=p.circ||{cervical:0,toracica:0,abdominal:0,coxa_d:0,coxa_e:0};
      p.data_consulta=p.data_consulta||today();
      DB[p.id]=p;
      if(p.pesos_data){try{var pd=JSON.parse(p.pesos_data);if(pd&&pd.length)pesos[p.id]=pd;}catch(e){}}
      if(!pesos[p.id])pesos[p.id]=[{semana:"Dia 0",data:p.data_consulta,peso:p.peso,nota:"Consulta inicial"}];
      if(p.metas_data){try{metasDB[p.id]=JSON.parse(p.metas_data);}catch(e){metasDB[p.id]=[];}}
      if(!metasDB[p.id])metasDB[p.id]=[];
      if(p.variaveis_data){try{variaveisDB[p.id]=JSON.parse(p.variaveis_data);}catch(e){variaveisDB[p.id]=[];}}
      if(!variaveisDB[p.id])variaveisDB[p.id]=[];
      if(!eccSt[p.id])eccSt[p.id]=p.ecc||5;
      if(!immSt[p.id])immSt[p.id]=p.imm||2;
      if(!circSt[p.id])circSt[p.id]=JSON.parse(JSON.stringify(p.circ));
      if(!circHist[p.id])circHist[p.id]={};if(!eccHist[p.id])eccHist[p.id]=[];if(!immHist[p.id])immHist[p.id]=[];
      if(!evolDB[p.id])evolDB[p.id]=[];if(!retornoDB[p.id])retornoDB[p.id]=[];
      if(!etapasDB[p.id])etapasDB[p.id]=[{id:1,nome:"Transicao alimentar",objetivo:"",duracao:15,unidade:"dias",inicio:p.data_consulta,fim:null,status:"ativa"}];
      if(!novosRegistros[p.id])novosRegistros[p.id]=0;
      if(!custosDB[p.id])custosDB[p.id]={alimentos:[],suplementos:[]};
      if(!comprasDB[p.id])comprasDB[p.id]={};
    });
    if(cb)cb();
  }).catch(function(){if(cb)cb();});
}

function _enterApp(uid){
  role="vet";
  currentUser=_getSession()&&_getSession().user;
  var bv=document.getElementById("badge-vet");
  if(bv)bv.style.display="flex";
  _loadPatients(uid,function(){
    renderPacList();
    show("s-pacientes");
  });
}

function _toast(msg){
  var t=document.createElement("div");
  t.style.cssText="position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#27ae60;color:#fff;padding:12px 24px;border-radius:20px;font-size:.85rem;font-weight:600;z-index:9999";
  t.textContent=msg;document.body.appendChild(t);
  setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},2500);
}

// Override savePacienteToDb
savePacienteToDb=function(id){
  if(!currentUser||!DB[id])return Promise.resolve();
  var p=DB[id];
  return fetch(_SB+"/rest/v1/pacientes?id=eq."+encodeURIComponent(id)+"&apikey="+_K,{
    method:"PATCH",
    headers:{"Content-Type":"application/json","apikey":_K,"Authorization":"Bearer "+_K,"Prefer":"return=minimal"},
    body:JSON.stringify({
      nome:p.nome,raca:p.raca,porte:p.porte,idade:p.idade,
      data_nasc:p.data_nasc||null,obs_condutas:p.obsCondutas||null,
      metas_data:JSON.stringify(metasDB[id]||[]),
      variaveis_data:JSON.stringify(variaveisDB[id]||[]),
      pesos_data:JSON.stringify(pesos[id]||[]),
      peso:p.peso,meta:p.meta,ecc:eccSt[id]||p.ecc,imm:immSt[id]||p.imm,
      kcal:p.kcal,fator:p.fator||70,refs:p.refs,
      alertas:p.alertas||[],horarios:p.horarios||[],especial:p.especial||"",
      alimentos:p.alimentos||[],suplementos:p.suplementos||[],
      circ:circSt[id]||p.circ||{},tutora:p.tutora||"",
      plano_tipo:p.plano_tipo||"essencial",
      plano_inicio:p.plano_inicio||null,plano_fim:p.plano_fim||null,
      updated_at:new Date().toISOString()
    })
  }).then(function(r){if(r.ok)_toast("Salvo!");return r.ok;});
};

// Override salvarCadastro
var _origSC=salvarCadastro;
salvarCadastro=function(){
  var nome=(document.getElementById("c-nome")||{value:""}).value.trim();
  var pesoV=parseFloat((document.getElementById("c-peso")||{value:""}).value);
  var metaV=parseFloat((document.getElementById("c-meta")||{value:""}).value);
  if(!nome||isNaN(pesoV)||isNaN(metaV)){alert("Preencha nome, peso e meta.");return;}
  _origSC();
  var ids=Object.keys(DB);
  var newId=ids[ids.length-1];
  if(!newId||!DB[newId])return;
  var p=DB[newId];
  fetch(_SB+"/rest/v1/pacientes?apikey="+_K,{
    method:"POST",
    headers:{"Content-Type":"application/json","apikey":_K,"Authorization":"Bearer "+_K,"Prefer":"return=representation"},
    body:JSON.stringify({
      vet_id:currentUser?currentUser.id:null,
      nome:p.nome,tutora:p.tutora||"",responsavel:p.responsavel||p.tutora||"",
      raca:p.raca||"SRD",porte:p.porte||"Médio",idade:p.idade||"",
      data_nasc:p.data_nasc||null,peso:p.peso,meta:p.meta,
      ecc:p.ecc||5,imm:p.imm||2,kcal:p.kcal||300,fator:70,refs:p.refs||2,
      data_consulta:p.dataCons||p.data_consulta||today(),
      alertas:p.alertas||[],horarios:p.horarios||[],especial:p.especial||"",
      alimentos:p.alimentos||[],suplementos:p.suplementos||[],
      circ:{cervical:0,toracica:0,abdominal:0,coxa_d:0,coxa_e:0},
      plano_tipo:"essencial",plano_inicio:null,plano_fim:null,
      pesos_data:JSON.stringify([{semana:"Dia 0",data:p.dataCons||today(),peso:p.peso,nota:"Consulta inicial"}]),
      metas_data:"[]",variaveis_data:"[]"
    })
  }).then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d};});})
  .then(function(res){
    if(!res.ok){alert("Erro: "+(res.d.message||JSON.stringify(res.d).slice(0,100)));return;}
    var saved=Array.isArray(res.d)?res.d[0]:res.d;
    delete DB[newId];
    saved.alertas=saved.alertas||[];saved.horarios=saved.horarios||[];
    saved.alimentos=saved.alimentos||[];saved.suplementos=saved.suplementos||[];
    saved.circ=saved.circ||{cervical:0,toracica:0,abdominal:0,coxa_d:0,coxa_e:0};
    DB[saved.id]=saved;
    pesos[saved.id]=[{semana:"Dia 0",data:p.dataCons||today(),peso:saved.peso,nota:"Consulta inicial"}];
    eccSt[saved.id]=saved.ecc||5;immSt[saved.id]=saved.imm||2;
    circSt[saved.id]={cervical:0,toracica:0,abdominal:0,coxa_d:0,coxa_e:0};
    circHist[saved.id]={};eccHist[saved.id]=[];immHist[saved.id]=[];
    evolDB[saved.id]=[];retornoDB[saved.id]=[];
    etapasDB[saved.id]=[{id:1,nome:"Transicao alimentar",objetivo:"",duracao:15,unidade:"dias",inicio:p.dataCons||today(),fim:null,status:"ativa"}];
    metasDB[saved.id]=[];variaveisDB[saved.id]=[];novosRegistros[saved.id]=0;
    custosDB[saved.id]={alimentos:[],suplementos:[]};comprasDB[saved.id]={};
    renderPacList();
    _toast("Paciente "+saved.nome+" cadastrado!");
  });
};

var bSS=document.getElementById("btn-signup-show");
var bSB=document.getElementById("btn-signup-back");
var sRole=document.getElementById("signup-role");
var cDiv=document.getElementById("crmv-div");
if(bSS)bSS.onclick=function(){
  document.getElementById("login-form").style.display="none";
  document.getElementById("signup-form").style.display="block";
};
if(bSB)bSB.onclick=function(){
  document.getElementById("signup-form").style.display="none";

};

document.getElementById("btn-login").onclick=function(){
  var errEl=document.getElementById("login-error");
  if(errEl)errEl.style.display="none";
  var email=(document.getElementById("login-email")||{}).value||"";
  var pass=(document.getElementById("login-pass")||{}).value||"";
  if(!email||!pass){if(errEl){errEl.textContent="Preencha e-mail e senha.";errEl.style.display="block";}return;}
  var btn=this;btn.textContent="...";btn.disabled=true;
  fetch(_SB+"/auth/v1/token?grant_type=password",{
    method:"POST",
    headers:{"Content-Type":"application/json","apikey":_K},
    body:JSON.stringify({email:email,password:pass})
  }).then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d};});})
  .then(function(res){
    btn.textContent="Entrar";btn.disabled=false;
    if(!res.ok){if(errEl){errEl.textContent="E-mail ou senha incorretos.";errEl.style.display="block";}return;}
    _setSession(res.d);
    currentUser=res.d.user;
    _enterApp(res.d.user.id);
  }).catch(function(e){
    btn.textContent="Entrar";btn.disabled=false;
    if(errEl){errEl.textContent="Erro: "+e.message;errEl.style.display="block";}
  });
};

document.getElementById("btn-signup").onclick=function(){
  var errEl=document.getElementById("signup-error");
  if(errEl)errEl.style.display="none";
  var nome=(document.getElementById("signup-nome")||{}).value||"";
  var email=(document.getElementById("signup-email")||{}).value||"";
  var pass=(document.getElementById("signup-pass")||{}).value||"";
  var rv=(document.getElementById("signup-role")||{}).value||"vet";
  if(!nome||!email||pass.length<6){if(errEl){errEl.textContent="Preencha todos os campos (senha mín. 6 chars).";errEl.style.display="block";}return;}
  var btn=this;btn.textContent="...";btn.disabled=true;
  fetch(_SB+"/auth/v1/signup",{
    method:"POST",
    headers:{"Content-Type":"application/json","apikey":_K},
    body:JSON.stringify({email:email,password:pass})
  }).then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d};});})
  .then(function(res){
    btn.textContent="Criar conta";btn.disabled=false;
    if(!res.ok){if(errEl){errEl.textContent=res.d.error_description||"Erro ao criar conta.";errEl.style.display="block";}return;}
    if(res.d.access_token)_setSession(res.d);
    currentUser=res.d.user;
    // Save profile
    fetch(_SB+"/rest/v1/perfis?apikey="+_K,{
      method:"POST",
      headers:{"Content-Type":"application/json","apikey":_K,"Authorization":"Bearer "+_K,"Prefer":"return=minimal"},
      body:JSON.stringify({id:res.d.user.id,nome:nome,role:rv})
    });
    _enterApp(res.d.user.id);
  }).catch(function(e){
    btn.textContent="Criar conta";btn.disabled=false;
    if(errEl){errEl.textContent="Erro: "+e.message;errEl.style.display="block";}
  });
};

document.getElementById("btn-logout").onclick=function(){
  _clearSession();currentUser=null;DB={};pac=null;
  show("s-login");
};

// ── Start ────────────────────────────────────────────
var _sess=_getSession();
if(_sess&&_sess.user){
  _enterApp(_sess.user.id);
} else {
  show("s-login");
}


}); // DOMContentLoaded
